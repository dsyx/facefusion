[face_detector]
face_detector_model = retinaface
face_detector_score = 0.4

[face_landmarker]
face_landmarker_model = hrffa

[face_selector]
face_selector_mode = one

[face_tracker]
face_tracker_score = 0.25

[face_masker]
face_occluder_model = xseg_2
face_mask_types = box occlusion

[output_creation]
output_audio_encoder = aac
output_video_encoder = hevc_nvenc
output_video_preset = slow
output_video_quality = 50

[processors]
face_swapper_pixel_boost = 512x512

[execution]
execution_thread_count = 12

[memory]
video_memory_strategy = tolerant

