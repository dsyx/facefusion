[face_detector]
face_detector_model = retinaface

[face_selector]
face_selector_mode = one

[face_masker]
face_occluder_model = xseg_2
face_mask_types = box occlusion
face_mask_blur = 0.35
face_mask_padding = 3 3 3 3

[output_creation]
output_image_quality = 95

[processors]
processors = face_swapper face_enhancer
face_enhancer_model = restoreformer_plus_plus
face_enhancer_blend = 65
face_swapper_model = hyperswap_1c_256
face_swapper_pixel_boost = 1024x1024
face_swapper_weight = 0.6

[memory]
video_memory_strategy = tolerant

