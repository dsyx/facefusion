[face_selector]
face_selector_mode = one

[face_masker]
face_occluder_model = xseg_2
face_mask_types = box occlusion

[frame_distribution]
target_frame_amount = 0

[output_creation]
output_audio_encoder = aac
output_video_encoder = hevc_nvenc
output_video_preset = veryfast
output_video_quality = 40

[processors]
face_swapper_pixel_boost = 512x512

[execution]
execution_thread_count = 12

[memory]
video_memory_strategy = tolerant

